# Compile and unit-test ProxyPlugin on every pull request into master.

name: PR Build

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud
        shell: pwsh
        run: |
          $dir = "$env:AppData\XIVLauncher\addon\Hooks\dev"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile dalamud.zip
          Expand-Archive -Force dalamud.zip $dir

      - name: Build
        run: dotnet build ProxyPlugin/ProxyPlugin.csproj --configuration Release

      - name: Test
        run: dotnet test ProxyPlugin.Core.Tests/ProxyPlugin.Core.Tests.csproj --configuration Release

      - name: Store artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ProxyPlugin
          path: ProxyPlugin/bin/**/ProxyPlugin/latest.zip
          if-no-files-found: error
          retention-days: 5
