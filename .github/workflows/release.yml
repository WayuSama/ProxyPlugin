name: Build Plugin Package
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - name: Validate version
        shell: pwsh
        run: |
          [xml]$project = Get-Content ProxyPlugin/ProxyPlugin.csproj
          $version = $project.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ($version -notmatch '^\d+\.\d+\.\d+\.\d+$') { throw 'Four numeric version parts required' }
          if ($env:GITHUB_REF -like 'refs/tags/*' -and $env:GITHUB_REF -ne "refs/tags/v$version") { throw 'Tag and project version differ' }
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Download Dalamud
        shell: pwsh
        run: |
          $dir = "$env:AppData\XIVLauncher\addon\Hooks\dev"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Invoke-WebRequest https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile dalamud.zip
          Expand-Archive dalamud.zip $dir -Force
      - name: Build
        shell: pwsh
        run: |
          dotnet build ProxyPlugin/ProxyPlugin.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
      - name: Unit tests
        shell: pwsh
        run: |
          dotnet test ProxyPlugin.Core.Tests -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Unit tests failed' }
      - name: HTTP and load context regression tests
        shell: pwsh
        run: ./scripts/test-interception.ps1
      - name: Prepare release
        shell: pwsh
        run: ./scripts/prepare-release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ProxyPlugin
          path: dist/*
          if-no-files-found: error
